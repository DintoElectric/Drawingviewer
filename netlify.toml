# Static site in /public + serverless functions. Storage is Netlify Blobs and
# auth is Netlify Identity — both are enabled in the Netlify UI (see docs/SETUP.md),
# not in this file.
[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
