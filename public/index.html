<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects — Drawings Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="./styles.css">
<link rel="stylesheet" href="./app.css">
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <div class="topbar">
    <div class="brand"><div class="mark">D</div><span class="name">Drawings Hub</span></div>
    <div class="spacer"></div>
    <div id="topbarUser"></div>
  </div>

  <div class="page" id="page" style="display:none">
    <div class="page-head">
      <div>
        <h1>Projects</h1>
        <div class="sub" id="sub">Your projects</div>
      </div>
      <div class="spacer"></div>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <!-- new project dialog -->
  <div class="backdrop hidden" id="newProjectDlg">
    <div class="modal" style="width:min(440px,100%)">
      <div class="m-head"><div><div class="m-title">New project</div><div class="m-sub">It starts empty — add drawings after.</div></div><div class="spacer"></div><button class="btn btn-icon btn-secondary" id="npClose"><i class="ph ph-x" style="font-size:16px"></i></button></div>
      <div class="m-body" style="padding-bottom:16px">
        <div class="field" style="margin-bottom:12px"><label>Project name</label><input class="input" id="npName" placeholder="e.g. Yale OML Renovation"></div>
        <div class="field"><label>Discipline</label>
          <select class="input" id="npDiscipline">
            <option>Electrical</option><option>Mechanical</option><option>Plumbing</option>
            <option>Architectural</option><option>Fire alarm</option><option>Multi-discipline</option>
          </select>
        </div>
        <div class="dlg-actions">
          <button class="btn btn-secondary" id="npCancel" style="min-height:38px">Cancel</button>
          <button class="btn btn-primary" id="npCreate" style="min-height:38px"><i class="ph ph-check"></i>Create project</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./js/projects-page.js"></script>
</body>
</html>
