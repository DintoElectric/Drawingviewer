<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sheet — Drawings Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="./styles.css">
<link rel="stylesheet" href="./app.css">
<link rel="stylesheet" href="./cmp-colors.css">
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<!-- pdf.js (classic build exposes the global pdfjsLib) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
  <div class="viewer-header">
    <a class="btn btn-icon btn-secondary" id="back" title="Back"><i class="ph ph-arrow-left" style="font-size:16px"></i></a>
    <span class="snum" id="snum">—</span>
    <span id="stitle" style="font:500 15px var(--font-heading)"></span>
    <button class="revpick" id="revpick">Rev — <i class="ph ph-caret-down" style="font-size:12px"></i></button>
    <div class="spacer"></div>
    <a class="btn btn-secondary" id="downloadBtn" style="min-height:36px" target="_blank"><i class="ph ph-download-simple"></i>Download</a>
  </div>

  <!-- viewer tools: zoom, pages, compare, print -->
  <div class="vtools" id="vtools">
    <div class="tgroup">
      <button class="tbtn" id="zoomOut" aria-label="Zoom out"><i class="ph ph-magnifying-glass-minus"></i></button>
      <button class="tbtn tbtn-text zoom-level" id="zoomLevel" title="Reset to 100%">100%</button>
      <button class="tbtn" id="zoomIn" aria-label="Zoom in"><i class="ph ph-magnifying-glass-plus"></i></button>
      <button class="tbtn tbtn-text" id="fitBtn"><i class="ph ph-corners-out"></i><span>Fit</span></button>
    </div>

    <div class="tgroup hidden" id="pageGroup">
      <button class="tbtn" id="pagePrev" aria-label="Previous page"><i class="ph ph-caret-left"></i></button>
      <span class="page-ind" id="pageInd">1 / 1</span>
      <button class="tbtn" id="pageNext" aria-label="Next page"><i class="ph ph-caret-right"></i></button>
    </div>

    <div class="vrule"></div>

    <button class="tbtn tbtn-text" id="cmpBtn" aria-pressed="false"><i class="ph ph-git-diff"></i><span>Compare</span></button>
    <div class="tgroup hidden" id="cmpGroup">
      <label class="cmp-label" for="cmpSelect">with</label>
      <select class="input cmp-select" id="cmpSelect"></select>
      <div class="seg" role="group" aria-label="Compare mode">
        <button class="seg-btn on" id="modeSlider"><i class="ph ph-columns"></i><span>Slider</span></button>
        <button class="seg-btn" id="modeOverlay"><i class="ph ph-stack"></i><span>Overlay</span></button>
      </div>
      <label class="opacity hidden" id="opacityWrap"><span>Old rev</span><input type="range" id="opacity" min="0" max="100" value="100"></label>
      <button class="tbtn tbtn-text hidden" id="colorBtn" title="Change the overlay colors"><i class="ph ph-palette"></i><span>Colors</span></button>
    </div>

    <div class="spacer"></div>
    <button class="tbtn tbtn-text" id="printBtn"><i class="ph ph-printer"></i><span>Print</span></button>
  </div>

  <div class="vshell">
    <div class="canvas" id="viewport">
      <div class="stage" id="stage">
        <canvas id="cvB"></canvas>
        <canvas id="cvA" class="hidden"></canvas>
        <div class="divider hidden" id="divider"><div class="handle"><i class="ph ph-arrows-left-right"></i></div></div>
      </div>

      <!-- fixed labels (don't move with zoom/pan) -->
      <div class="cmp-chip chip-a hidden" id="lblA"></div>
      <div class="cmp-chip chip-b hidden" id="lblB"></div>
      <div class="legend hidden" id="legend"></div>

      <div class="empty hidden" id="empty"></div>
    </div>
    <aside class="history">
      <div class="h-label">Revisions</div>
      <div id="revs"></div>
    </aside>
  </div>

  <!-- print-only area (filled by sheet-page.js just before window.print()) -->
  <div class="print-only" id="printArea">
    <div class="print-head" id="printHead"></div>
    <img id="printImg" alt="">
  </div>

  <script type="module" src="./js/sheet-page.js"></script>
</body>
</html>
